<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MONOLITH — Stack · Work Items</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0f11;--panel:#151518;--panel-2:#1b1b20;--raised:#222228;
    --line:#2c2c33;--line-2:#3e3e47;--ink:#e7e7e3;--mute:#8a8a93;--dim:#56565e;
    --yellow:#ffd400;--yellow-dim:#b89800;--black:#0a0a0a;
    --hazard:repeating-linear-gradient(45deg,var(--yellow) 0 8px,var(--black) 8px 16px);
    --hatch:repeating-linear-gradient(45deg,rgba(255,212,0,.85) 0 2px,transparent 2px 7px);
    --cols:184px 108px minmax(300px,1fr) 168px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Space Mono",ui-monospace,monospace;font-size:13px;line-height:1.45;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(var(--line) .8px,transparent .8px);background-size:18px 18px;opacity:.35}
  .display{font-family:"Bricolage Grotesque",sans-serif}

  .app{position:relative;z-index:1;display:flex;flex-direction:column;height:100dvh}

  /* top rail */
  .rail{display:flex;align-items:center;justify-content:space-between;background:var(--panel);
        border-bottom:3px solid var(--line-2);padding:0 18px;height:50px;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:12px}
  .wordmark{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;letter-spacing:-.02em}
  .wordmark b{background:var(--yellow);color:var(--black);padding:1px 6px}
  .crumb{font-size:11px;color:var(--mute);letter-spacing:.1em}
  .crumb b{color:var(--ink)}
  .ro{font-size:11px;color:var(--mute)}.ro b{color:var(--ink)}

  /* toolbar */
  .toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 18px;border-bottom:1px solid var(--line);
           background:var(--panel-2);flex:0 0 auto}
  .toolbar .tk{width:13px;height:13px;background:var(--yellow)}
  .toolbar h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:16px;margin:0;letter-spacing:-.01em}
  .toolbar .meta{font-size:11px;color:var(--mute)}
  .toolbar .meta b{color:var(--ink)}
  .ovr{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mute)}
  .ovr .obar{width:120px;height:8px;background:var(--bg);border:1px solid var(--line-2);position:relative}
  .ovr .obar i{position:absolute;inset:0;right:auto;background:var(--yellow)}
  .ovr .opct{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:13px;color:var(--ink)}
  .spacer{flex:1}
  .btn{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
       background:none;border:1px solid var(--line-2);color:var(--ink);padding:6px 11px;cursor:pointer}
  .btn:hover{border-color:var(--yellow);color:var(--yellow)}
  .filters{display:flex;gap:0;border:1px solid var(--line-2)}
  .filters button{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
       background:none;border:none;color:var(--mute);padding:6px 11px;cursor:pointer;border-right:1px solid var(--line-2)}
  .filters button:last-child{border-right:none}
  .filters button.on{background:var(--yellow);color:var(--black);font-weight:700}

  /* list */
  .scroll{flex:1 1 auto;min-height:0;overflow:auto}
  .listinner{min-width:780px}
  .thead,.row{display:grid;grid-template-columns:var(--cols);align-items:stretch}
  .thead{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line-2)}
  .thead>div{padding:9px 14px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);
             border-right:1px solid var(--line)}
  .thead>div:last-child{border-right:none}

  .row{min-height:46px;border-bottom:1px solid var(--line);position:relative}
  .row:hover{background:var(--panel-2)}
  .row.depth0{background:var(--panel)}
  .row.depth0:hover{background:var(--panel-2)}
  .row.depth0::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--yellow-dim)}
  .row>div{border-right:1px solid var(--line);display:flex;align-items:center}
  .row>div:last-child{border-right:none}

  /* progress cell */
  .c-prog{gap:9px;padding:0 12px}
  .ptile{width:20px;height:20px;flex:0 0 auto;border:1px solid var(--line-2)}
  .ptile.done{background:var(--yellow);border-color:var(--yellow)}
  .ptile.active{background:var(--hatch),var(--raised);border-color:var(--yellow)}
  .ptile.blocked{background:var(--hazard);background-size:6px 6px;border-color:var(--yellow)}
  .ptile.pending{background:var(--raised)}
  .ptile.skipped{background:var(--raised);border-style:dashed}
  .pbar{flex:1;height:8px;min-width:36px;background:var(--bg);border:1px solid var(--line-2);position:relative;overflow:hidden}
  .pbar i{position:absolute;inset:0;right:auto;background:var(--yellow)}
  .pbar i.active{background:var(--hatch),var(--yellow)}
  .pbar i.blocked{background:var(--hazard);background-size:6px 6px}
  .ppct{flex:0 0 auto;width:34px;text-align:right;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:13px}

  /* number / id */
  .c-nid{flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:0 14px}
  .c-nid .num{font-weight:700;font-size:13px;letter-spacing:.02em}
  .row.depth0 .c-nid .num{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px}
  .c-nid .wid{font-size:10px;color:var(--mute);letter-spacing:.04em}

  /* item / tree */
  .c-item{padding:0;align-items:stretch}
  .item{display:flex;align-items:stretch;width:100%;min-width:0}
  .guides{display:flex;align-items:stretch;flex:0 0 auto}
  .gcell{width:24px;position:relative;flex:0 0 auto}
  .gcell.v::before{content:"";position:absolute;left:12px;top:0;bottom:0;border-left:1px solid var(--line-2)}
  .gcell.mid::before{content:"";position:absolute;left:12px;top:0;bottom:0;border-left:1px solid var(--line-2)}
  .gcell.mid::after{content:"";position:absolute;left:12px;top:50%;width:11px;border-top:1px solid var(--line-2)}
  .gcell.end::before{content:"";position:absolute;left:12px;top:0;height:50%;border-left:1px solid var(--line-2)}
  .gcell.end::after{content:"";position:absolute;left:12px;top:50%;width:11px;border-top:1px solid var(--line-2)}
  .imain{display:flex;align-items:center;gap:8px;min-width:0;padding:0 12px 0 6px;flex:1}
  .tog{flex:0 0 auto;width:18px;height:18px;display:grid;place-items:center;border:1px solid var(--line-2);
       background:var(--bg);color:var(--ink);cursor:pointer;font-size:11px;line-height:1;padding:0}
  .tog:hover{border-color:var(--yellow);color:var(--yellow)}
  .tog.leaf{border:none;background:none;color:var(--dim);cursor:default}
  .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .row.depth0 .ttl{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;letter-spacing:-.01em}
  .row.depth1 .ttl{font-weight:700}
  .kids{flex:0 0 auto;font-size:10px;color:var(--mute);border:1px solid var(--line);padding:1px 6px}

  /* meta */
  .c-meta{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:0 14px}
  .st{font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .st .sd{width:9px;height:9px;flex:0 0 auto}
  .st.done{color:var(--mute)} .st.done .sd{background:var(--yellow)}
  .st.active{color:var(--yellow)} .st.active .sd{background:var(--hatch),var(--raised)}
  .st.blocked{color:var(--yellow)} .st.blocked .sd{background:var(--hazard);background-size:5px 5px}
  .st.pending{color:var(--mute)} .st.pending .sd{background:var(--raised)}
  .st.skipped{color:var(--dim)} .st.skipped .sd{background:var(--raised);border:1px dashed var(--line-2)}
  .who{font-size:10px;color:var(--mute)}

  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:var(--line-2)}
  ::-webkit-scrollbar-track{background:var(--bg)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <header class="rail">
    <div class="brand">
      <div class="wordmark display">MONO<b>LITH</b></div>
      <span class="crumb">stack <b>//</b> <b>work items</b></span>
    </div>
    <div class="ro">node <b>0xC4·7</b></div>
  </header>

  <div class="toolbar">
    <span class="tk"></span>
    <h1 class="display">WORK STACK</h1>
    <span class="meta"><b id="leafcount">0</b> leaf · <b id="totalcount">0</b> total</span>
    <div class="ovr">rollup
      <span class="obar"><i id="obar" style="width:0%"></i></span>
      <span class="opct" id="opct">0%</span>
    </div>
    <span class="spacer"></span>
    <div class="filters" id="filters">
      <button data-f="all" class="on">All</button>
      <button data-f="active">Active</button>
      <button data-f="blocked">Blocked</button>
    </div>
    <button class="btn" id="expandAll">Expand</button>
    <button class="btn" id="collapseAll">Collapse</button>
  </div>

  <div class="scroll"><div class="listinner">
    <div class="thead">
      <div>Progress</div><div>N° / ID</div><div>Item</div><div>Owner</div>
    </div>
    <div id="rows"></div>
  </div></div>
</div>

<script>
/* ---------------- data ---------------- */
const DATA=[
  {id:'WI-A100',title:'Pipeline core',children:[
    {id:'WI-A110',title:'Ingest service',children:[
      {id:'WI-A111',title:'Object intake API',owner:'spool-3',pct:100,state:'done'},
      {id:'WI-A112',title:'Checksum + dedup',owner:'spool-3',pct:100,state:'done'},
      {id:'WI-A113',title:'Quarantine bucket for malformed payloads',owner:'spool-1',pct:60,state:'active'},
    ]},
    {id:'WI-A120',title:'Dependency resolver',children:[
      {id:'WI-A121',title:'Transitive graph builder',owner:'spool-2',pct:100,state:'done'},
      {id:'WI-A122',title:'Version pinning + conflict resolution',children:[
        {id:'WI-A1221',title:'Lockfile writer',owner:'spool-2',pct:70,state:'active'},
        {id:'WI-A1222',title:'Drift detector against pinned manifest',owner:'spool-4',pct:0,state:'pending'},
      ]},
      {id:'WI-A123',title:'Resolution cache layer',owner:'spool-4',pct:0,state:'pending'},
    ]},
  ]},
  {id:'WI-A200',title:'Build subsystem',children:[
    {id:'WI-A210',title:'Compiler bridge',owner:'spool-2',pct:100,state:'done'},
    {id:'WI-A220',title:'Linker against libcrypto-9',owner:'spool-2',pct:80,state:'active'},
    {id:'WI-A230',title:'Artifact packager + sealing',owner:'spool-3',pct:0,state:'pending'},
  ]},
  {id:'WI-A300',title:'Test harness',children:[
    {id:'WI-A310',title:'Unit runner',owner:'spool-1',pct:100,state:'done'},
    {id:'WI-A320',title:'Integration grid',children:[
      {id:'WI-A321',title:'Fixture seeder',owner:'spool-1',pct:100,state:'done'},
      {id:'WI-A322',title:'Parallel scheduler with shard balancing',owner:'spool-4',pct:50,state:'active'},
    ]},
    {id:'WI-A330',title:'E2E orchestrator — settlement-loop timeout',owner:'spool-1',pct:30,state:'blocked'},
  ]},
  {id:'WI-A400',title:'Signing & release',children:[
    {id:'WI-A410',title:'Key custody + rotation',owner:'spool-3',pct:100,state:'done'},
    {id:'WI-A420',title:'Quorum signer (2-of-3)',owner:'spool-3',pct:33,state:'active'},
    {id:'WI-A430',title:'Ship gate + rollout controller',owner:'spool-2',pct:0,state:'pending'},
  ]},
  {id:'WI-A500',title:'Observability',children:[
    {id:'WI-A510',title:'Metrics pipe',owner:'spool-2',pct:100,state:'done'},
    {id:'WI-A520',title:'Trace fan-out',owner:'spool-4',pct:0,state:'skipped'},
    {id:'WI-A530',title:'Alert rule authoring',owner:'spool-1',pct:0,state:'pending'},
  ]},
  {id:'WI-A600',title:'Docs & runbooks',children:[
    {id:'WI-A610',title:'Operator manual',owner:'spool-1',pct:20,state:'active'},
    {id:'WI-A620',title:'Incident playbooks',owner:'spool-4',pct:0,state:'pending'},
  ]},
];

/* ---------------- rollups + tree metadata ---------------- */
function deriveState(states){
  if(states.includes('blocked'))return'blocked';
  const real=states.filter(s=>s!=='skipped');
  if(real.length===0)return'skipped';
  if(real.every(s=>s==='done'))return'done';
  if(real.every(s=>s==='pending'))return'pending';
  return'active';
}
function rollup(node){
  if(!node.children){node.__leaves=[{pct:node.pct,state:node.state}];return node.__leaves;}
  let leaves=[];
  node.children.forEach(c=>{leaves=leaves.concat(rollup(c));});
  node.__leaves=leaves;
  const counted=leaves.filter(l=>l.state!=='skipped');
  node.__pct=counted.length?Math.round(counted.reduce((a,l)=>a+l.pct,0)/counted.length):0;
  node.__state=deriveState(leaves.map(l=>l.state));
  return leaves;
}
function pad(n){return String(n).padStart(2,'0');}
function annotate(nodes,flags,depth,prefix){
  nodes.forEach((n,i)=>{
    const last=i===nodes.length-1;
    n.__depth=depth;n.__last=last;n.__flags=flags;
    n.__num=prefix?prefix+'.'+pad(i+1):pad(i+1);
    if(n.children){
      n.__hasKids=true;
      const childFlags=depth===0?[]:flags.concat(!last);
      annotate(n.children,childFlags,depth+1,n.__num);
    }else{n.__pct=n.pct;n.__state=n.state;n.__hasKids=false;}
  });
}
DATA.forEach(rollup);
annotate(DATA,[],0,'');

let totalCount=0,leafCount=0;
(function count(ns){ns.forEach(n=>{totalCount++;if(!n.__hasKids)leafCount++;else count(n.children);});})(DATA);

/* overall rollup across all top-level leaves */
const allLeaves=DATA.flatMap(n=>n.__leaves);
const counted=allLeaves.filter(l=>l.state!=='skipped');
const overall=counted.length?Math.round(counted.reduce((a,l)=>a+l.pct,0)/counted.length):0;
document.getElementById('leafcount').textContent=leafCount;
document.getElementById('totalcount').textContent=totalCount;
document.getElementById('obar').style.width=overall+'%';
document.getElementById('opct').textContent=overall+'%';

/* ---------------- render ---------------- */
const collapsed=new Set();
let filter='all';
const STLAB={done:'done',active:'active',blocked:'blocked',pending:'pending',skipped:'skipped'};

function matches(node){
  if(filter==='all')return true;
  if(node.__state===filter)return true;
  return node.children?node.children.some(matches):false;
}

function guidesHTML(node){
  if(node.__depth===0)return'';
  let g='';
  node.__flags.forEach(f=>{g+=`<div class="gcell ${f?'v':''}"></div>`;});
  g+=`<div class="gcell ${node.__last?'end':'mid'}"></div>`;
  return g;
}
function rowHTML(node){
  const st=node.__state,pct=node.__pct||0;
  const barCls=st==='blocked'?'blocked':st==='active'?'active':'';
  const tog=node.__hasKids
    ? `<button class="tog" data-num="${node.__num}">${collapsed.has(node.__num)&&filter==='all'?'\u25B8':'\u25BE'}</button>`
    : `<span class="tog leaf">\u00B7</span>`;
  const owner=node.__hasKids?`${node.children.length} sub-items`:(node.owner||'—');
  return `<div class="row depth${Math.min(node.__depth,3)}" data-num="${node.__num}">
    <div class="c-prog">
      <span class="ptile ${st}"></span>
      <span class="pbar"><i class="${barCls}" style="width:${st==='skipped'?0:pct}%"></i></span>
      <span class="ppct">${st==='skipped'?'—':pct+'%'}</span>
    </div>
    <div class="c-nid"><span class="num">${node.__num}</span><span class="wid">${node.id}</span></div>
    <div class="c-item"><div class="item"><div class="guides">${guidesHTML(node)}</div>
      <div class="imain">${tog}<span class="ttl" title="${node.title}">${node.title}</span>${node.__hasKids?`<span class="kids">${node.children.length}</span>`:''}</div>
    </div></div>
    <div class="c-meta"><span class="st ${st}"><span class="sd"></span>${STLAB[st]}</span><span class="who">${owner}</span></div>
  </div>`;
}
function render(){
  const out=[];
  (function walk(nodes){
    nodes.forEach(n=>{
      if(filter!=='all'&&!matches(n))return;
      out.push(rowHTML(n));
      const isCollapsed=filter==='all'&&collapsed.has(n.__num);
      if(n.children&&!isCollapsed)walk(n.children);
    });
  })(DATA);
  document.getElementById('rows').innerHTML=out.join('');
}

document.getElementById('rows').addEventListener('click',e=>{
  const t=e.target.closest('.tog');if(!t||t.classList.contains('leaf'))return;
  const num=t.dataset.num;
  collapsed.has(num)?collapsed.delete(num):collapsed.add(num);
  render();
});
document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  filter=b.dataset.f;
  document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
document.getElementById('expandAll').addEventListener('click',()=>{collapsed.clear();render();});
document.getElementById('collapseAll').addEventListener('click',()=>{
  collapsed.clear();
  (function w(ns){ns.forEach(n=>{if(n.__hasKids){collapsed.add(n.__num);w(n.children);}});})(DATA);
  render();
});

render();
</script>
</body>
</html>
