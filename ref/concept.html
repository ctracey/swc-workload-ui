<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MONOLITH — Run Control · v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0f11;
    --panel:#151518;
    --panel-2:#1b1b20;
    --raised:#222228;
    --line:#2c2c33;
    --line-2:#3e3e47;
    --ink:#e7e7e3;
    --mute:#8a8a93;
    --dim:#56565e;
    --yellow:#ffd400;
    --yellow-dim:#b89800;
    --black:#0a0a0a;
    --rail-h:50px;
    --hazard:repeating-linear-gradient(45deg,var(--yellow) 0 9px,var(--black) 9px 18px);
    --hatch:repeating-linear-gradient(45deg,rgba(255,212,0,.85) 0 2px,transparent 2px 7px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
    font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;
  }
  body::before{ /* faint dotted graphite texture */
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:radial-gradient(var(--line) .8px,transparent .8px);
    background-size:18px 18px;opacity:.35;
  }
  .display{font-family:"Bricolage Grotesque",sans-serif}

  .app{position:relative;z-index:1;display:grid;grid-template-rows:var(--rail-h) 1fr;height:100dvh}

  /* ---- rail ---- */
  .rail{display:flex;align-items:stretch;justify-content:space-between;background:var(--panel);
        border-bottom:3px solid var(--line-2);position:relative}
  .rail::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--hazard);
               background-size:auto;opacity:0;}
  .rail .brand{display:flex;align-items:center;gap:14px;padding:0 18px;border-right:1px solid var(--line)}
  .wordmark{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:23px;letter-spacing:-.02em;line-height:1}
  .wordmark b{background:var(--yellow);color:var(--black);padding:1px 6px;margin-left:1px}
  .verflag{font-size:10px;letter-spacing:.2em;color:var(--mute);border:1px solid var(--line-2);padding:2px 6px}
  .readouts{display:flex;align-items:stretch}
  .ro{display:flex;align-items:center;gap:8px;padding:0 16px;border-left:1px solid var(--line);
      font-size:11px;letter-spacing:.06em;color:var(--mute)}
  .ro b{color:var(--ink);font-weight:700}
  .led{width:8px;height:8px;background:var(--yellow);box-shadow:0 0 9px var(--yellow);border-radius:50%}
  .live .led{animation:blink 2s steps(1) infinite}
  @keyframes blink{50%{opacity:.2}}

  .body{display:grid;grid-template-columns:300px 1fr;min-height:0}

  /* ---- sidebar ---- */
  .sidebar{background:var(--panel);border-right:3px solid var(--line-2);display:flex;flex-direction:column;min-height:0}
  .secbar{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);
          font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
  .secbar .tk{width:14px;height:14px;background:var(--yellow)}
  .secbar .cnt{margin-left:auto;color:var(--ink)}
  .cardlist{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}

  .card{border:1px solid var(--line-2);background:var(--panel-2);cursor:pointer;position:relative;
        transition:border-color .12s,background .12s}
  .card:hover{border-color:var(--mute)}
  .card:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
  .card.sel{border-color:var(--yellow)}
  .card .top{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;
             border-bottom:1px solid var(--line);background:var(--panel)}
  .card.sel .top{background:var(--yellow);color:var(--black);border-bottom-color:var(--yellow-dim)}
  .card .top .cid{font-size:10px;letter-spacing:.08em}
  .card .top .cpc{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:13px}
  .card .mid{padding:9px 10px 11px}
  .card .nm{font-weight:700;font-size:14px;letter-spacing:-.01em;margin-bottom:8px}
  .card .row{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--mute);margin-bottom:9px}
  .card .tag{font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border:1px solid currentColor}
  .strip{display:flex;gap:2px}
  .strip i{flex:1;height:9px;background:var(--panel)}
  .strip i.done{background:var(--yellow)}
  .strip i.active{background:var(--hatch),var(--panel-2);background-blend-mode:normal;border:1px solid var(--yellow)}
  .strip i.blocked{background:var(--hazard);background-size:6px 6px}
  .strip i.pending{background:var(--raised)}
  .strip i.skipped{background:repeating-linear-gradient(45deg,var(--line-2) 0 2px,transparent 2px 5px)}

  .t-active{color:var(--yellow)} .t-blocked{color:var(--ink)} .t-done{color:var(--mute)}

  /* ---- main ---- */
  .main{display:grid;grid-template-rows:minmax(220px,30%) 1fr;min-height:0;background:var(--bg)}
  .panel{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;
         border:3px solid var(--line-2);background:var(--panel)}
  .main>.panel{border-top:none}
  .main>.panel:first-child{border-top:3px solid var(--line-2)}
  .bottom{display:grid;grid-template-columns:1.5fr 1fr;min-height:0}
  .bottom>.panel{border-top:none}
  .bottom>.panel:last-child{border-left:none}

  /* rivets */
  .rivet{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--line-2);
         box-shadow:inset 0 0 0 1px var(--bg);z-index:3}
  .rivet.a{top:6px;left:6px}.rivet.b{top:6px;right:6px}.rivet.c{bottom:6px;left:6px}.rivet.d{bottom:6px;right:6px}

  .phead{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);
         font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);flex:0 0 auto}
  .phead .tk{width:13px;height:13px;background:var(--yellow);flex:0 0 auto}
  .phead .tag{color:var(--ink)}
  .phead .right{margin-left:auto;color:var(--dim)}
  .pbody{flex:1 1 auto;min-height:0;overflow:auto}

  /* ---- workflow tape ---- */
  .tape{display:flex;gap:18px;padding:18px 18px 12px;min-width:max-content;height:100%}
  .seg{flex:1 1 150px;min-width:150px;position:relative;display:flex;flex-direction:column;gap:7px}
  .seg:not(:last-child) .cell::after{content:"\203A";position:absolute;right:-13px;top:50%;
      transform:translateY(-50%);color:var(--dim);font-size:18px;font-weight:700}
  .cell{position:relative;height:66px;border:1px solid var(--line-2);background:var(--raised);
        padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between}
  .cell .ci{font-size:9px;letter-spacing:.12em;color:var(--mute)}
  .cell .cl{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1}
  .cell .cs{font-size:9px;letter-spacing:.12em;text-transform:uppercase}
  .cell[data-st="done"]{background:var(--yellow);border-color:var(--yellow)}
  .cell[data-st="done"] .ci,.cell[data-st="done"] .cl,.cell[data-st="done"] .cs{color:var(--black)}
  .cell[data-st="active"]{border:2px solid var(--yellow);background:var(--panel)}
  .cell[data-st="active"]::before{content:"";position:absolute;inset:0;background:var(--hatch);opacity:.5;
      animation:slide 1.1s linear infinite}
  .cell[data-st="active"] .cs{color:var(--yellow)}
  .cell[data-st="blocked"]{background:var(--hazard);background-size:auto;border-color:var(--yellow)}
  .cell[data-st="blocked"] .ci,.cell[data-st="blocked"] .cl{color:var(--yellow);text-shadow:0 0 4px #000,0 1px 2px #000}
  .cell[data-st="blocked"] .cs{color:var(--yellow);text-shadow:0 1px 2px #000}
  .cell[data-st="pending"] .ci,.cell[data-st="pending"] .cl,.cell[data-st="pending"] .cs{color:var(--mute)}
  .cell[data-st="skipped"]{border-style:dashed;opacity:.55}
  .cell[data-st="skipped"] .cl{text-decoration:line-through}
  @keyframes slide{from{background-position:0 0}to{background-position:18px 0}}

  /* sub-tape */
  .subtape{height:38px;display:flex;gap:4px;align-items:stretch}
  .subtape.empty{border:none}
  .subseg{flex:1;border:1px solid var(--line);background:var(--panel-2);padding:5px 6px;
          display:flex;flex-direction:column;justify-content:space-between;min-width:0}
  .subseg .sl{font-size:9px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .subseg .sd{height:4px;background:var(--raised)}
  .subseg[data-st="done"]{border-color:var(--yellow)}
  .subseg[data-st="done"] .sd{background:var(--yellow)}
  .subseg[data-st="active"]{border-color:var(--yellow)}
  .subseg[data-st="active"] .sd{background:var(--hatch),var(--raised);animation:slide 1.1s linear infinite}
  .subseg[data-st="blocked"]{border-color:var(--yellow)}
  .subseg[data-st="blocked"] .sd{background:var(--hazard);background-size:6px 6px}
  .subseg[data-st="skipped"]{border-style:dashed;opacity:.55}
  .subseg .slab{font-size:8px;color:var(--mute);letter-spacing:.08em;margin-bottom:auto}

  /* ---- log / text ---- */
  .log{padding:12px 0;font-size:12px}
  .logline{display:grid;grid-template-columns:18px 78px 50px 1fr;gap:8px;padding:2px 16px}
  .logline .ln{color:var(--dim);text-align:right}
  .logline .t{color:var(--dim)}
  .logline .lv{font-weight:700;letter-spacing:.04em}
  .lv-ok{color:var(--yellow)} .lv-warn{color:var(--ink)} .lv-err{color:var(--yellow)} .lv-info{color:var(--mute)}
  .logline.err{background:repeating-linear-gradient(45deg,rgba(255,212,0,.07) 0 9px,transparent 9px 18px)}
  .logline.err .lv::before{content:"\25C6 "}
  .note{border-top:1px solid var(--line);padding:11px 16px;flex:0 0 auto;background:var(--panel-2)}
  .note label{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);display:flex;gap:8px;align-items:center}
  .note label::before{content:"";width:11px;height:11px;background:var(--yellow)}
  .note .field{margin-top:7px;min-height:40px;border:1px solid var(--line-2);background:var(--bg);
               padding:8px 11px;color:var(--ink);outline:none;caret-color:var(--yellow)}
  .note .field:focus{border-color:var(--yellow)}
  .note .field:empty::before{content:attr(data-ph);color:var(--dim)}

  /* ---- instrument dial ---- */
  .dial{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100%;padding:16px}
  .dwrap{position:relative;width:196px;height:196px;flex:0 0 auto}
  .dwrap svg{width:100%;height:100%;display:block}
  .dcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
  .dcenter .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:48px;line-height:.85;letter-spacing:-.03em}
  .dcenter .big span{font-size:18px;color:var(--mute);font-weight:700}
  .dcenter .lab{font-size:8px;letter-spacing:.3em;color:var(--mute);text-transform:uppercase;margin-top:5px}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px;width:100%;max-width:260px}
  .lrow{display:flex;align-items:center;gap:8px;font-size:11px;transition:opacity .12s}
  .lrow .sw{width:12px;height:12px;flex:0 0 auto;border:1px solid var(--line-2)}
  .sw.done{background:var(--yellow)}
  .sw.active{background:var(--hatch),var(--panel)}
  .sw.blocked{background:var(--hazard);background-size:6px 6px}
  .sw.pending{background:var(--raised)}
  .sw.skipped{background:repeating-linear-gradient(45deg,var(--line-2) 0 2px,transparent 2px 5px)}
  .lrow .lk{color:var(--mute);letter-spacing:.05em;text-transform:uppercase;font-size:9px}
  .lrow .lc{margin-left:auto;color:var(--ink);font-weight:700}
  .lrow.dim,.seg-w.dim{opacity:.25}
  .seg-w{transition:opacity .12s;cursor:default}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line-2)}
  ::-webkit-scrollbar-track{background:var(--bg)}

  @media (max-width:920px){
    body{overflow:auto}.app{height:auto;min-height:100dvh}
    .body{grid-template-columns:1fr}.sidebar{border-right:none;border-bottom:3px solid var(--line-2)}
    .cardlist{flex-direction:row;overflow-x:auto}.card{min-width:230px}
    .main{grid-template-rows:auto auto}.bottom{grid-template-columns:1fr}
    .bottom>.panel:last-child{border-left:3px solid var(--line-2);border-top:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <header class="rail">
    <div class="brand">
      <div class="wordmark">MONO<b>LITH</b></div>
      <span class="verflag">REV·2</span>
    </div>
    <div class="readouts">
      <div class="ro">NODE <b>0xC4·7</b></div>
      <div class="ro">QUEUE <b id="qcount">6</b></div>
      <div class="ro" id="clockbox">UTC <b id="clock">--:--:--</b></div>
      <div class="ro live"><span class="led"></span><b>ONLINE</b></div>
    </div>
  </header>

  <div class="body">

    <aside class="sidebar">
      <div class="secbar"><span class="tk"></span><span>Runs</span><span class="cnt" id="runcount">6</span></div>
      <div class="cardlist" id="cards" role="listbox" aria-label="Runs"></div>
    </aside>

    <section class="main">

      <div class="panel">
        <span class="rivet a"></span><span class="rivet b"></span><span class="rivet c"></span><span class="rivet d"></span>
        <div class="phead"><span class="tk"></span><span>Workflow</span><span class="tag" id="wfid">—</span>
          <span class="right" id="wfstage">stage —</span></div>
        <div class="pbody"><div class="tape" id="tape"></div></div>
      </div>

      <div class="bottom">
        <div class="panel">
          <span class="rivet c"></span>
          <div class="phead"><span class="tk"></span><span>Log</span><span class="tag" id="logid">—</span>
            <span class="right">tail -f</span></div>
          <div class="pbody"><div class="log" id="log"></div></div>
          <div class="note">
            <label for="notefield">Operator note</label>
            <div class="field" id="notefield" contenteditable="true" role="textbox" aria-multiline="true"
                 data-ph="type a directive for this run…"></div>
          </div>
        </div>

        <div class="panel">
          <span class="rivet b"></span><span class="rivet d"></span>
          <div class="phead"><span class="tk"></span><span>Distribution</span><span class="right">leaf stages</span></div>
          <div class="pbody"><div class="dial">
            <div class="dwrap">
              <svg viewBox="0 0 100 100" id="dialsvg" aria-label="Overall progress"></svg>
              <div class="dcenter"><div class="big" id="pct">0<span>%</span></div><div class="lab">Complete</div></div>
            </div>
            <div class="legend" id="legend"></div>
          </div></div>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
const STAGES=[
  {key:'ingest',label:'INGEST',type:'leaf'},
  {key:'resolve',label:'RESOLVE',type:'leaf'},
  {key:'build',label:'BUILD',type:'group',sub:[{key:'compile',label:'COMPILE'},{key:'link',label:'LINK'},{key:'pack',label:'PACK'}]},
  {key:'test',label:'TEST',type:'group',sub:[{key:'unit',label:'UNIT'},{key:'integ',label:'INTEG'},{key:'e2e',label:'E2E'}]},
  {key:'sign',label:'SIGN',type:'leaf'},
  {key:'ship',label:'SHIP',type:'leaf'},
];
const LEAVES=['ingest','resolve','compile','link','pack','unit','integ','e2e','sign','ship'];

const RUNS=[
  {id:'RUN-4F2A',name:'atlas-gateway',branch:'main',agent:'spool-3',status:'SIGNING',
   st:{ingest:'done',resolve:'done',compile:'done',link:'done',pack:'done',unit:'done',integ:'done',e2e:'done',sign:'active',ship:'pending'},
   log:[['info','intake accepted · 412 objects'],['ok','build artifact 4f2a sealed'],['ok','test matrix 9/9 green'],['warn','awaiting signing quorum (2/3)'],['info','ship gate held — pending signature']]},
  {id:'RUN-4F2B',name:'ledger-sync',branch:'rc/2.7',agent:'spool-1',status:'BLOCKED',
   st:{ingest:'done',resolve:'done',compile:'done',link:'done',pack:'done',unit:'done',integ:'done',e2e:'blocked',sign:'pending',ship:'pending'},
   log:[['ok','build artifact 4f2b sealed'],['ok','unit 240/240'],['ok','integ 51/51'],['err','e2e fault · timeout on settlement-loop'],['err','run halted — manual intervention required']]},
  {id:'RUN-4F31',name:'vault-rotate',branch:'main',agent:'spool-2',status:'BUILDING',
   st:{ingest:'done',resolve:'done',compile:'done',link:'active',pack:'pending',unit:'pending',integ:'pending',e2e:'pending',sign:'pending',ship:'pending'},
   log:[['info','intake accepted · 88 objects'],['ok','dependency graph resolved'],['ok','compile clean · 0 warnings'],['info','linking against libcrypto-9'],['info','est. completion 00:03:40']]},
  {id:'RUN-4F33',name:'edge-cache',branch:'feat/ttl',agent:'spool-4',status:'RESOLVING',
   st:{ingest:'done',resolve:'active',compile:'pending',link:'pending',pack:'pending',unit:'pending',integ:'pending',e2e:'pending',sign:'pending',ship:'pending'},
   log:[['info','intake accepted · 19 objects'],['info','resolving 7 transitive deps'],['warn','version drift on zlib (pinned 1.3)'],['info','retrying resolver pass 2/3']]},
  {id:'RUN-4F40',name:'telemetry-pipe',branch:'main',agent:'spool-2',status:'SHIPPED',
   st:{ingest:'done',resolve:'done',compile:'done',link:'done',pack:'done',unit:'done',integ:'done',e2e:'done',sign:'done',ship:'done'},
   log:[['ok','build sealed · signed · shipped'],['ok','all gates green'],['info','rollout 100% · 4 regions'],['info','run archived to cold store']]},
  {id:'RUN-4F44',name:'auth-broker',branch:'hotfix/jwt',agent:'spool-1',status:'TESTING',
   st:{ingest:'done',resolve:'done',compile:'done',link:'done',pack:'done',unit:'done',integ:'skipped',e2e:'active',sign:'pending',ship:'pending'},
   log:[['ok','build artifact 4f44 sealed'],['ok','unit 118/118'],['warn','integ suite skipped by flag --fast'],['info','e2e running · 12/40 scenarios']]},
];

const ORDER=['done','active','blocked','pending','skipped'];
const LBL={done:'Done',active:'Active',blocked:'Blocked',pending:'Pending',skipped:'Skipped'};

function groupState(run,sub){
  const s=sub.map(x=>run.st[x.key]);
  if(s.includes('blocked'))return'blocked';
  if(s.includes('active'))return'active';
  if(s.every(v=>v==='done'))return'done';
  if(s.every(v=>v==='skipped'))return'skipped';
  if(s.every(v=>v==='pending'||v==='skipped'))return'pending';
  return'active';
}
function stats(run){
  const c={done:0,active:0,blocked:0,pending:0,skipped:0};
  LEAVES.forEach(k=>c[run.st[k]]++);
  const denom=LEAVES.length-c.skipped;
  return{c,pct:denom?Math.round(100*c.done/denom):0,total:LEAVES.length};
}
function currentStage(run){
  for(const st of STAGES){
    if(st.type==='leaf'){if(['active','blocked'].includes(run.st[st.key]))return st.label+' · '+run.st[st.key];}
    else{const g=groupState(run,st.sub);if(['active','blocked'].includes(g)){
      const s=st.sub.find(x=>['active','blocked'].includes(run.st[x.key]));
      return st.label+(s?' / '+s.label:'')+' · '+g;}}
  }
  return LEAVES.every(k=>['done','skipped'].includes(run.st[k]))?'COMPLETE · shipped':'QUEUED';
}

let selected=0;

function renderCards(){
  const el=document.getElementById('cards');el.innerHTML='';
  RUNS.forEach((r,i)=>{
    const s=stats(r);
    const tcl=r.status==='BLOCKED'?'t-blocked':r.status==='SHIPPED'?'t-done':'t-active';
    const strip=LEAVES.map(k=>`<i class="${r.st[k]}"></i>`).join('');
    const card=document.createElement('div');
    card.className='card'+(i===selected?' sel':'');card.tabIndex=0;
    card.setAttribute('role','option');card.setAttribute('aria-selected',i===selected);
    card.innerHTML=`
      <div class="top"><span class="cid">${r.id} · ${r.branch}</span><span class="cpc">${s.pct}%</span></div>
      <div class="mid">
        <div class="nm">${r.name}</div>
        <div class="row"><span class="tag ${tcl}">${r.status}</span><span>${r.agent}</span></div>
        <div class="strip">${strip}</div>
      </div>`;
    const pick=()=>select(i);
    card.addEventListener('click',pick);
    card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}});
    el.appendChild(card);
  });
}

function renderTape(run){
  const tape=document.getElementById('tape');tape.innerHTML='';
  STAGES.forEach((st,i)=>{
    const state=st.type==='leaf'?run.st[st.key]:groupState(run,st.sub);
    const seg=document.createElement('div');seg.className='seg';
    let sub='';
    if(st.type==='group'){
      const subs=st.sub.map(x=>{const ss=run.st[x.key];
        return `<div class="subseg" data-st="${ss}"><div class="sl">${x.label}</div><div class="sd"></div></div>`;}).join('');
      sub=`<div class="subtape"><div class="subseg" style="flex:0 0 100%;border:none;background:none;padding:0">
            <span class="slab">SUB / ${st.sub.length}</span></div></div>`;
      sub=`<div class="subtape">${subs}</div>`;
    }else{
      sub=`<div class="subtape empty"></div>`;
    }
    seg.innerHTML=`
      <div class="cell" data-st="${state}">
        <div class="ci">ST ${String(i+1).padStart(2,'0')}</div>
        <div class="cl">${st.label}</div>
        <div class="cs">${state}</div>
      </div>${sub}`;
    tape.appendChild(seg);
  });
  document.getElementById('wfid').textContent=run.id;
  document.getElementById('wfstage').textContent='stage '+currentStage(run).toLowerCase();
}

function renderLog(run){
  const el=document.getElementById('log');el.innerHTML='';let t=0;
  run.log.forEach((ln,i)=>{
    t+=7+i*5;const mm=String(Math.floor(t/60)).padStart(2,'0'),ss=String(t%60).padStart(2,'0');
    const row=document.createElement('div');row.className='logline'+(ln[0]==='err'?' err':'');
    row.innerHTML=`<span class="ln">${String(i+1).padStart(2,'0')}</span><span class="t">00:${mm}:${ss}</span>`+
                  `<span class="lv lv-${ln[0]}">${ln[0].toUpperCase()}</span><span>${ln[1]}</span>`;
    el.appendChild(row);
  });
  document.getElementById('logid').textContent=run.id;
}

/* ---- instrument dial ---- */
const COL={done:'var(--yellow)',pending:'var(--raised)',skipped:'var(--line-2)'};
function polar(cx,cy,rad,a){return[cx+rad*Math.cos(a),cy+rad*Math.sin(a)];}
function donut(cx,cy,R,r,a0,a1){
  const big=(a1-a0)>Math.PI?1:0;
  const[x0,y0]=polar(cx,cy,R,a0),[x1,y1]=polar(cx,cy,R,a1);
  const[x2,y2]=polar(cx,cy,r,a1),[x3,y3]=polar(cx,cy,r,a0);
  return`M${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${big} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} `+
        `L${x2.toFixed(2)} ${y2.toFixed(2)} A${r} ${r} 0 ${big} 0 ${x3.toFixed(2)} ${y3.toFixed(2)} Z`;
}
function renderDial(run){
  const s=stats(run);const svg=document.getElementById('dialsvg');
  const cx=50,cy=50;
  // defs: hazard + hatch patterns
  let defs=`<defs>
    <pattern id="hz" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#0a0a0a"/><rect width="3" height="6" fill="#ffd400"/></pattern>
    <pattern id="ht" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#151518"/><rect width="1.4" height="5" fill="#ffd400"/></pattern>
  </defs>`;
  // tick gauge bezel
  let ticks='';const N=72;
  for(let i=0;i<N;i++){
    const a=-Math.PI/2+(i/N)*Math.PI*2;const long=(i%6===0);
    const ro=48,ri=long?42.5:44.5;
    const[x0,y0]=polar(cx,cy,ri,a),[x1,y1]=polar(cx,cy,ro,a);
    const on=(i/N)*100<=s.pct;
    ticks+=`<line x1="${x0.toFixed(2)}" y1="${y0.toFixed(2)}" x2="${x1.toFixed(2)}" y2="${y1.toFixed(2)}"
      stroke="${on?'#ffd400':'#3e3e47'}" stroke-width="${long?1.4:0.9}"/>`;
  }
  // wedges
  const fill=k=>k==='blocked'?'url(#hz)':k==='active'?'url(#ht)':COL[k];
  const present=ORDER.filter(k=>s.c[k]>0);
  let wedges='';const R=38,r=24;
  if(present.length===1){
    const k=present[0];
    wedges=`<g class="seg-w" data-k="${k}"><circle cx="50" cy="50" r="${(R+r)/2}" fill="none"
              stroke="${k==='done'?'#ffd400':'#222228'}" stroke-width="${R-r}"/></g>`;
    if(k==='blocked'||k==='active')
      wedges=`<g class="seg-w" data-k="${k}"><path d="${donut(cx,cy,R,r,-Math.PI/2,1.5*Math.PI)}" fill="${fill(k)}"/></g>`;
  }else{
    let a=-Math.PI/2;const gap=0.05,scale=(Math.PI*2-gap*present.length)/s.total;
    present.forEach(k=>{
      const a0=a+gap/2,a1=a0+s.c[k]*scale;
      wedges+=`<g class="seg-w" data-k="${k}"><path d="${donut(cx,cy,R,r,a0,a1)}" fill="${fill(k)}"
                stroke="#0f0f11" stroke-width="0.6"/></g>`;
      a=a1+gap/2;
    });
  }
  svg.innerHTML=defs+ticks+wedges;
  document.getElementById('pct').innerHTML=s.pct+'<span>%</span>';

  const legend=document.getElementById('legend');
  legend.innerHTML=ORDER.map(k=>`
    <div class="lrow" data-k="${k}"><span class="sw ${k}"></span>
      <span class="lk">${LBL[k]}</span><span class="lc">${s.c[k]}</span></div>`).join('');
  legend.querySelectorAll('.lrow').forEach(row=>{
    row.addEventListener('mouseenter',()=>hl(row.dataset.k));
    row.addEventListener('mouseleave',()=>hl(null));
  });
  svg.querySelectorAll('.seg-w').forEach(w=>{
    w.addEventListener('mouseenter',()=>hl(w.dataset.k));
    w.addEventListener('mouseleave',()=>hl(null));
  });
}
function hl(k){
  document.querySelectorAll('#dialsvg .seg-w').forEach(w=>w.classList.toggle('dim',k&&w.dataset.k!==k));
  document.querySelectorAll('#legend .lrow').forEach(r=>r.classList.toggle('dim',k&&r.dataset.k!==k));
}

function select(i){
  selected=i;const run=RUNS[i];
  document.querySelectorAll('#cards .card').forEach((c,idx)=>{
    c.classList.toggle('sel',idx===i);c.setAttribute('aria-selected',idx===i);});
  renderTape(run);renderLog(run);renderDial(run);
}

function tick(){const d=new Date(),p=n=>String(n).padStart(2,'0');
  document.getElementById('clock').textContent=p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds());}

document.getElementById('runcount').textContent=RUNS.length;
document.getElementById('qcount').textContent=RUNS.length;
renderCards();select(0);tick();setInterval(tick,1000);
</script>
